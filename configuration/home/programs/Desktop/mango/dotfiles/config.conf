# ============================================================================
# mango 配置
# ----------------------------------------------------------------------------
# 校验命令：mango -c ~/.config/mango/config.conf -p
# 说明：按应用区分的规则（window_rule / layer_rule 里的 app-id / title /
#       namespace）按要求跳过，未做迁移。
# ============================================================================

# 可选引入的颜色/主题片段（不存于时忽略）
source_optional=~/.config/mango/noctalia.conf


# ============================================================================
# 一、输出（显示器）
# ----------------------------------------------------------------------------
# monitor_rule 用键值对描述一个输出。name 支持正则。
#   width/height/refresh  分辨率与刷新率
#   x/y                   在全局坐标系中的位置
#   scale                 缩放（1 = 不缩放）
#   rr                    rotation（0 = 不旋转）
#   vrr                   可变刷新率（0 关，1 开）
#   primary               主显示器（1 = 是）
# ============================================================================
monitor_rule=name:^DP-1$,width:2560,height:1600,refresh:165,x:0,y:0,scale:1,rr:0,vrr:0,primary:1


# ============================================================================
# 二、布局
# ----------------------------------------------------------------------------
# mango 支持多种布局，每个 tag 独立保存自己的布局状态。
# tag_rule 里的 layout_name 只是该 tag 的**初始**布局，运行时可随时切换。
#
# 可用布局（见 src/layout/arrange.c: layouts[]）：
#   tile              等分平铺（mango 默认）
#   scroller          横向滚动的列（类 niri 手感）
#   vertical_scroller 纵向滚动的行
#   vertical_tile / grid / vertical_grid / monocle / deck /
#   center_tile / right_tile / vertical_deck / dwindle / fair / vertical_fair
# ============================================================================
tag_num=9
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# 滚动布局的预分配列数（同时存在的虚拟列槽位）
scroller_structs=20
# 新列默认占屏宽的比例（0.5 = 半屏）
scroller_default_proportion=0.5
# 只有一个窗口时是否铺满整屏（1.0 = 铺满）
scroller_default_proportion_single=1.0
# switch_proportion_preset 可循环切换的宽度预设列表
scroller_proportion_preset=0.25,0.3,0.35,0.4,0.45,0.5,0.55,0.6,0.65,0.7,0.75,0.8,0.85,0.9,0.95,1
# 以下三项控制“聚焦列是否居中”的行为：
#   focus_center   聚焦时把列滚到屏幕中央（1 开）
#   prefer_center  布局时优先居中
#   prefer_overspread  允许列超出屏幕宽度铺开
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=0
# 鼠标移到边缘时自动滚动并聚焦
edge_scroller_pointer_focus=1
# 智能间距：根据窗口数量自动调整间距（0 关闭，保持固定间距）
smart_gaps=0

# switch_layout（Super+N）按此顺序轮换当前 tag 的布局
circle_layout=scroller,vertical_scroller,tile,dwindle,grid,monocle,deck,fair

# 间距（内外统一为 10，避免内外不一致造成的视觉错位）
gap_inner_horizontal=10
gap_inner_vertical=10
gap_outer_horizontal=10
gap_outer_vertical=10


# ============================================================================
# 三、外观
# ----------------------------------------------------------------------------
# 边框宽度、圆角半径（0 = 直角）
# no_radius_when_single 为 1 时单窗口不画圆角
# ============================================================================
border_px=4
border_radius=12
no_radius_when_single=0

# 聚焦 / 未聚焦窗口的不透明度（1.0 = 完全不透明）
focused_opacity=1.0
unfocused_opacity=1.0

# 阴影开关；shadow_only_floating 仅对浮动窗口加阴影
shadows=1
layer_shadows=1
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadows_color=0x000000ff

# ============================================================================
# 四、模糊
# ----------------------------------------------------------------------------
# blur             窗口内容模糊
# blur_layer       对 layer-shell 表面（dock / 面板 / OSD 等）也启用模糊
# blur_optimized   1 = 只模糊壁纸（性能好但效果弱），0 = 模糊窗口内容
# blur_params_*    模糊的迭代次数、半径、噪点、亮度、对比度、饱和度
# ============================================================================
blur=1
blur_layer=1
# waybar 自身不需要模糊，单独关闭
layer_rule=layer_name:^waybar$,no_blur:1
blur_optimized=0
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

# 未聚焦窗口暗化（0 = 关闭）
dim_enable=0


# ============================================================================
# 五、动画
# ----------------------------------------------------------------------------
# animations         窗口动画总开关
# layer_animations   layer 表面动画开关（关闭以免面板/OSD 闪烁）
# animation_type_*   打开/关闭的动画类型：slide / zoom / fade 等
# animation_curve_*  贝塞尔曲线 (x1,y1,x2,y2)
# animation_duration_*  各动作时长（毫秒）
# ============================================================================
# ── 动画 ──────────────────────────────────────────────
animations=1
layer_animations=0
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1


# ============================================================================
# 六、焦点行为 / 杂项
# ----------------------------------------------------------------------------
# sloppy_focus          鼠标悬停即聚焦（1 开）
# focus_on_activate     新窗口请求激活时自动聚焦
# warp_cursor           聚焦时把光标移到窗口上（0 关）
# focus_cross_monitor   允许焦点跨显示器移动
# focus_cross_tag       允许焦点跨 tag 移动
# no_border_when_single 单窗口不画边框
# enable_floating_snap  浮动窗口边缘吸附
# snap_distance         吸附触发距离（像素）
# axis_bind_apply_timeout  滚轮 bind 的生效超时
# hotarea_size / enable_hotarea  屏幕边缘热区大小与开关
# overview_gap_*        概览模式的内外间距
# ============================================================================
sloppy_focus=0
focus_on_activate=1
warp_cursor=0
focus_cross_monitor=0
focus_cross_tag=0
no_border_when_single=0
enable_floating_snap=0
snap_distance=30
axis_bind_apply_timeout=100
hotarea_size=10
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30
# overcircle 预览：中间那列（聚焦窗口）占可用宽度的比例
overcircle_center_ratio=0.5
# 预览 / switcher 底部的标题栏：第一行窗口标题、第二行 app id；0 = 关闭
title_message_bar_height=52
title_message_bar_gap=20


# ============================================================================
# 七、键盘 / 输入法
# ----------------------------------------------------------------------------
# xkb_rules_layout  键盘布局（中文输入交给 fcitx5）
# numlock_on        启动时开启小键盘
# repeat_rate       长按重复频率（次/秒）
# repeat_delay      长按到开始重复的延迟（毫秒）
# ============================================================================
xkb_rules_layout=us
numlock_on=1
repeat_rate=25
repeat_delay=600


# ============================================================================
# 八、触控板
# ----------------------------------------------------------------------------
# tap_to_click                点击即点按
# tap_and_drag                点按拖动
# drag_lock                   拖动锁定
# trackpad_natural_scrolling  自然滚动方向
# trackpad_disable_while_typing  打字时禁用触控板
# trackpad_left_handed        左手模式
# trackpad_middle_button_emulation  中键模拟
# swipe_min_threshold         滑动识别最小距离
# ============================================================================
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1


# ============================================================================
# 九、鼠标
# ----------------------------------------------------------------------------
# mouse_natural_scrolling  鼠标滚轮自然方向
# ============================================================================
mouse_natural_scrolling=0


# ============================================================================
# 十、光标
# ----------------------------------------------------------------------------
# cursor_theme         XCursor 主题名
# cursor_size          光标尺寸（像素）
# cursor_hide_timeout  无操作后隐藏光标的延时（毫秒）
# cursor_hide_on_keypress  按键时是否隐藏光标
# ============================================================================
cursor_theme=Windows-Cursor
cursor_size=48
cursor_hide_timeout=3000
cursor_hide_on_keypress=1


# ============================================================================
# 十一、环境变量
# ----------------------------------------------------------------------------
# 语法：env=NAME,VALUE
# LANG / LC_ALL / LC_MESSAGES / LANGUAGE：中文界面
# XMODIFIERS / GTK_IM_MODULE / QT_IM_MODULE / QT_IM_MODULES：fcitx5 输入法
# QT_QPA_PLATFORMTHEME：Qt 主题
# GSK_RENDERER：GTK 渲染后端
# QS_ICON_THEME：Quickshell 图标主题
# ============================================================================
env=LANG,zh_CN.UTF-8
env=LC_ALL,zh_CN.UTF-8
env=LC_MESSAGES,zh_CN.UTF-8
env=LANGUAGE,zh_CN:en
env=XMODIFIERS,@im=fcitx
env=GTK_IM_MODULE,fcitx
env=QT_IM_MODULE,fcitx
env=QT_IM_MODULES,wayland;fcitx;ibus
env=QT_QPA_PLATFORMTHEME,qt6ct
env=GSK_RENDERER,gl
env=QS_ICON_THEME,Papirus-Dark
env=ELECTRON_OZONE_PLATFORM_HINT,x11

# ============================================================================
# 十二、自启动
# ----------------------------------------------------------------------------
# exec_once  仅在 mango 首次启动时执行一次（重载配置不重跑）
# exec       每次重载都执行
# 启动顺序：fcitx5（输入法）→ noctalia（壳/面板）→ waybar（状态栏）
# waybar 由 home-manager 安装，可能不在 PATH 中，因此先 command -v 查找，
# 找不到再回退到 ~/.nix-profile/bin；延时 2 秒等 noctalia 铺好 layer 层。
# ============================================================================
exec_once=fcitx5
exec_once=noctalia
exec_once=sh -c "sleep 2; exec waybar"

# XDG portal（OBS 屏幕采集 / 浏览器共享 / 截图 / polkit 认证）依赖
# graphical-session.target 处于 active；ly 直接拉起 mango 不会激活它。
# 先把会话环境导入 systemd 用户实例（否则 portal 后端拿不到 WAYLAND_DISPLAY），
# 再拉起 mango-session.target，由它通过依赖作业激活 graphical-session.target。
exec_once=sh -c "/run/current-system/sw/bin/dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP; /run/current-system/sw/bin/systemctl --user start mango-session.target"

# ============================================================================
# 十三、快捷键
# ----------------------------------------------------------------------------
# 键名用 xkb 名字（wev / xev 可查）；修饰键：SUPER / CTRL / ALT / SHIFT
# bind 标志位前缀：
#   s = sym 作用于符号键   l = lock 锁屏也生效   r = release 按键释放时触发
#   p = pass 放行给客户端  c = allowconflict 允许冲突绑定
# 动作后带逗号的空参数表示该动作无需参数，如 killclient,
# ============================================================================

# 重载配置
bind=SUPER+SHIFT,r,reload_config

# ── 应用启动 ──────────────────────────────────────────────
# F1 切换 fcitx5 输入法
bind=SUPER,F1,spawn_shell,pkill fcitx5 || fcitx5 &
bind=SUPER,b,spawn_shell,google-chrome
bind=SUPER+ALT,b,spawn_shell,firefox
bind=SUPER+ALT,o,spawn_shell,kitty --class opencode -e opencode
bind=SUPER,t,spawn_shell,kitty
bind=SUPER,x,spawn_shell,nautilus
bind=SUPER,e,spawn_shell,noctalia msg panel-toggle launcher
bind=SUPER,q,killclient,

# Print 整屏截图；Shift+Print 选区截图（存盘 + 同步进剪贴板）
# wl-copy 让截图可以直接 Ctrl+V 粘贴，相当于 niri 内置 screenshot 的行为
bind=NONE,Print,spawn,noctalia msg screenshot-region
bind=SHIFT,Print,spawn_shell,mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +%Y%m%d%H%M%S).png | wl-copy

# ── 音量 / 亮度（bindl = 锁屏时也生效）─────────────────────
# 优先用 swayosd-client（带 OSD 提示），失败则回退到 wpctl / brightnessctl
bindl=NONE,XF86AudioRaiseVolume,spawn_shell,swayosd-client --output-volume +5 || wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+
bindl=NONE,XF86AudioLowerVolume,spawn_shell,swayosd-client --output-volume -5 || wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bindl=NONE,XF86AudioMute,spawn_shell,swayosd-client --output-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl --class=backlight set +5%
bindl=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl --class=backlight set 5%-

# ── 焦点 ──────────────────────────────────────────────────
# 左右：跨列移动焦点
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
# 上下：列内窗口之间切换焦点
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,k,focusstack,prev
bind=SUPER,j,focusstack,next
bind=SUPER,w,focusstack,prev
bind=SUPER,s,focusstack,next

# ── 移动窗口 / 列 ─────────────────────────────────────────
# 左右：把窗口/列整体移到相邻列
bind=SUPER+CTRL,Left,move_client,left
bind=SUPER+CTRL,Right,move_client,right
bind=SUPER+CTRL,h,move_client,left
bind=SUPER+CTRL,l,move_client,right
bind=SUPER+CTRL,a,move_client,left
bind=SUPER+CTRL,d,move_client,right
# 上下：交换列内相邻窗口的位置
bind=SUPER+CTRL,Up,exchange_stack_client,prev
bind=SUPER+CTRL,Down,exchange_stack_client,next
bind=SUPER+CTRL,k,exchange_stack_client,prev
bind=SUPER+CTRL,j,exchange_stack_client,next
bind=SUPER+CTRL,w,exchange_stack_client,prev
bind=SUPER+CTRL,s,exchange_stack_client,next

# ── 显示器 ────────────────────────────────────────────────
# Super+Shift+方向：把焦点移到另一台显示器
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+SHIFT,h,focusmon,left
bind=SUPER+SHIFT,l,focusmon,right
bind=SUPER+SHIFT,k,focusmon,up
bind=SUPER+SHIFT,j,focusmon,down
# Super+Shift+Ctrl+方向：把当前 tag 整体移到另一台显示器
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,Down,tagmon,down
bind=SUPER+SHIFT+CTRL,h,tagmon,left
bind=SUPER+SHIFT+CTRL,l,tagmon,right
bind=SUPER+SHIFT+CTRL,k,tagmon,up
bind=SUPER+SHIFT+CTRL,j,tagmon,down
bind=SUPER+SHIFT+CTRL,a,tagmon,left
bind=SUPER+SHIFT+CTRL,s,tagmon,down
bind=SUPER+SHIFT+CTRL,w,tagmon,up
bind=SUPER+SHIFT+CTRL,d,tagmon,right

# ── 工作区（tag）──────────────────────────────────────────
# 左右切换可见工作区
bind=SUPER,i,viewtoleft,0
bind=SUPER,u,viewtoright,0
bind=SUPER+CTRL,i,tagtoleft,0
bind=SUPER+CTRL,u,tagtoright,0
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,Page_Down,viewtoright,0
bind=SUPER+CTRL,Page_Up,tagtoleft,0
bind=SUPER+CTRL,Page_Down,tagtoright,0

# Super+数字：切换到对应工作区
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
# Super+Ctrl+数字：把当前窗口送到对应工作区
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

# ── 布局切换 ──────────────────────────────────────────────
# Super+N：按 circle_layout 顺序循环切换当前 tag 的布局
bind=SUPER,n,switch_layout
# Super+Alt+数字：直接跳到指定布局
bind=SUPER+ALT,1,setlayout,scroller
bind=SUPER+ALT,2,setlayout,vertical_scroller
bind=SUPER+ALT,3,setlayout,tile
bind=SUPER+ALT,4,setlayout,dwindle
bind=SUPER+ALT,5,setlayout,grid
bind=SUPER+ALT,6,setlayout,monocle
bind=SUPER+ALT,7,setlayout,deck
bind=SUPER+ALT,8,setlayout,fair
bind=SUPER+ALT,9,setlayout,vertical_tile

# ── 列宽 / 堆叠（仅 scroller / vertical_scroller 生效）────
# Super+R / Super+Equal：下一档；Super+Minus：上一档
# 直接用预设表步进（0.05 一档），不再依赖外部脚本
bind=SUPER,r,switch_proportion_preset,next
bind=SUPER,Equal,switch_proportion_preset,next
bind=SUPER,Minus,switch_proportion_preset,prev
# Super+Ctrl+F：当前列扩展到全部可用宽度
bind=SUPER+CTRL,f,set_proportion,1.0
# Super+C：把当前窗口居中
bind=SUPER,c,centerwin,
# Super+[ / ]、A / D：把窗口收进/弹出左侧或右侧的列
bind=SUPER,bracketleft,scroller_stack,left
bind=SUPER,bracketright,scroller_stack,right
bind=SUPER,a,scroller_stack,left
bind=SUPER,d,scroller_stack,right
# Super+, / .、Shift+A / D：同上（合并/拆分列的另一种键位）
bind=SUPER,comma,scroller_stack,left
bind=SUPER,period,scroller_stack,right
bind=SUPER+SHIFT,a,scroller_stack,left
bind=SUPER+SHIFT,d,scroller_stack,right
# Super+Home/End：跳到首列/末列
bind=SUPER,Home,focusdir,left
bind=SUPER,End,focusdir,right

# ── 窗口状态 ──────────────────────────────────────────────
# Super+F 最大化；Super+Shift+F 全屏
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
# Super+V 切换浮动/平铺
bind=SUPER,v,togglefloating,
# Super+P / Super+G 切换概览（网格总览；Super+O 已改为字母跳转）
bind=SUPER,p,toggleoverview,
bind=SUPER,g,toggleoverview,
# Super+Shift+E 退出 mango
bind=SUPER+SHIFT,e,quit,
# Super+Shift+Q 关闭当前窗口
bind=SUPER+SHIFT,q,killclient,

# ── 鼠标 / 滚轮 ───────────────────────────────────────────
# 滚轮左右：切换焦点列
axisbind=SUPER,DOWN,focusdir,right
axisbind=SUPER,UP,focusdir,left
# Ctrl+滚轮：移动列
axisbind=SUPER+CTRL,DOWN,move_client,right
axisbind=SUPER+CTRL,UP,move_client,left
# Shift+滚轮：切换工作区
axisbind=SUPER+SHIFT,DOWN,viewtoright,0
axisbind=SUPER+SHIFT,UP,viewtoleft,0
# Ctrl+Shift+滚轮：把列送到其它工作区
axisbind=SUPER+CTRL+SHIFT,DOWN,tagtoright,0
axisbind=SUPER+CTRL+SHIFT,UP,tagtoleft,0

# 鼠标中键：关闭窗口
mousebind=SUPER,btn_middle,killclient,
# 侧键：列内窗口前后切换
mousebind=SUPER,btn_forward,focusstack,prev
mousebind=SUPER,btn_back,focusstack,next
# Super+左键拖动：移动窗口；Super+右键拖动：调整大小
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize


# ============================================================================
# 十四、niri 迁移补齐
# ----------------------------------------------------------------------------
# 从旧 niri 配置补回来的功能，以及 mango 有但之前没配的能力。
# 每条都经过 `mango -c <file> -p` 校验，且与上面的键位无冲突。
# ============================================================================

# ── 媒体键（旧 niri 有播放控制，迁移时漏了）─────────────────
# bindl = 锁屏时也生效
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

# ── 浮动窗口键盘移动 / 缩放 ───────────────────────────────
# 移动：movewin 是相对位移，`+80` 加、`-80` 减、`+0` 表示该轴不动，步进 80px。
#   （原来用 smartmovewin，一步 1/4 屏≈640px，太粗，已换掉）
#   想更细/更粗只改下面每行里的 80 这一个数字。
# 缩放：仍用 smartresizewin，步进 1/8 屏并吸附避让其它浮动窗，
#   它自带「不小于 1/10 屏高」的下限，不会像 resizewin 那样连按缩到 9px。
# 平铺窗口按一下会先自动转浮动，不必先按 Super+V。
bind=SUPER+ALT,h,movewin,-80,+0
bind=SUPER+ALT,j,movewin,+0,+80
bind=SUPER+ALT,k,movewin,+0,-80
bind=SUPER+ALT,l,movewin,+80,+0
bind=SUPER+ALT+SHIFT,h,smartresizewin,left
bind=SUPER+ALT+SHIFT,j,smartresizewin,down
bind=SUPER+ALT+SHIFT,k,smartresizewin,up
bind=SUPER+ALT+SHIFT,l,smartresizewin,right
# 方向键镜像，与上面 H/J/K/L 完全等价，照顾方向键的肌肉记忆
bind=SUPER+ALT,Left,movewin,-80,+0
bind=SUPER+ALT,Down,movewin,+0,+80
bind=SUPER+ALT,Up,movewin,+0,-80
bind=SUPER+ALT,Right,movewin,+80,+0
bind=SUPER+ALT+SHIFT,Left,smartresizewin,left
bind=SUPER+ALT+SHIFT,Down,smartresizewin,down
bind=SUPER+ALT+SHIFT,Up,smartresizewin,up
bind=SUPER+ALT+SHIFT,Right,smartresizewin,right

# ── 切换窗口 / 回退 ───────────────────────────────────────
# Alt+Tab 缩略图切窗：按住 Alt 连按 Tab 往后翻，松开 Alt 才真正切过去
bind=ALT,Tab,switcher,next
bind=ALT+SHIFT,Tab,switcher,prev
# ── 预览界面：四种排布 ────────────────────────────────────
# mango 的预览一共四种：overview(网格) / jump(网格+字母跳转) /
# overcircle(聚焦卡片居中、其它窗口排两侧) / switcher(居中缩略图条)
# 网格总览 → Super+P；字母跳转 → Super+O；居中聚焦 → Super+Tab
# 仅显示当前 tagset 的总览（不带其它工作区的窗口）
bind=SUPER+SHIFT,o,toggleoverview,1
# jump 模式：总览上给每个窗口打字母，按字母直接跳过去，Esc 退出
bind=SUPER,o,togglejump,
# overcircle：聚焦窗口居中放大，其余窗口排在左右两侧，连按同一个键前后翻，
#             松开 Super 退出
bind=SUPER,Tab,overcircle,next
# Super+Alt+Tab：回到上一个 tagset（对应 niri 的 focus-workspace-previous）
bind=SUPER+ALT,Tab,view,-1
# Super+` ：在当前和上一个窗口之间来回跳
bind=SUPER,grave,focuslast,
# Super+Ctrl+\：当前 tag 还有窗口就插入一个新空 tag 并切过去，
#               这是最接近 niri「动态工作区」手感的一条
bind=SUPER+CTRL,backslash,view_insert,next

# ── scratchpad 划痕板 ─────────────────────────────────────
# Super+Shift+M 收进划痕板；Super+Alt+M 取回到当前 tag
bind=SUPER+SHIFT,m,minimized,
bind=SUPER+ALT,m,restore_minimized,
# Super+Shift+T 显示 / 隐藏划痕板
bind=SUPER+SHIFT,t,toggle_scratchpad,

# ── 其它实用键位 ──────────────────────────────────────────
# 把窗口钉到所有 tag（每个工作区都能看到，适合音乐播放器、聊天窗）
bind=SUPER+SHIFT,g,toggleglobal,
# 间距增减：10 → 12 → 14 …，减少用 Super+Alt+Minus
bind=SUPER+ALT,equal,incgaps,+2
bind=SUPER+ALT,minus,incgaps,-2
# 一键禁用 / 启用触控板（打字或外接鼠标时很实用）
bind=SUPER+ALT,t,toggle_trackpad_enable,
