[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "win2xcursor"
version = "1.0.0"
description = "Convert Windows .ani/.cur cursor schemes to an Xcursor theme"
requires-python = ">=3.9"
dependencies = ["pillow"]

[project.scripts]
win2xcursor = "win2xcursor:main"

[tool.setuptools]
py-modules = ["win2xcursor"]
